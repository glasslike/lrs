# The build does not run on a branch push. Two ways to start it:
#   Actions → Build on NetBSD 11 → Run workflow, then pick the branch.
#   Push a tag. This file is read from that tag, the tree is that commit,
#   and the zip is attached to the release for the tag. The release is
#   created by the job when the tag was pushed on its own.
# The Run workflow button is listed only when this file is on the
# default branch, and the chosen branch must contain this file too.
#
# GitHub has no NetBSD runner, and the official self-hosted runner has no
# NetBSD build either. vmactions/netbsd-vm boots a real NetBSD under QEMU
# inside the Ubuntu runner, syncs the checked-out tree in, runs the build,
# and syncs dist/ back out. The self-test runs in that guest, so this is
# a native build, not a cross-compile.
# See .github/scripts/build-netbsd.sh.

name: Build on NetBSD 11

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build on NetBSD 11 (amd64)
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 on
    # 2026-10-19. The host only supplies QEMU for the guest, so the drop
    # does not depend on it, but the move should be a deliberate commit.
    runs-on: ubuntu-24.04
    # gh release upload needs to add assets. Manual runs only upload
    # Actions artifacts, which the same token can do with contents: read,
    # but one permission set covers both triggers.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The whole build, including pkg_add, lives in the script so the
      # same file can be run by hand on a NetBSD box. The action copies
      # the tree back afterwards (copyback defaults to true), which is
      # how dist/ reaches the runner for the upload steps below.
      - name: Build and pack in NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          run: |
            cd "$GITHUB_WORKSPACE"
            sh .github/scripts/build-netbsd.sh

      # archive: false uploads the zip as itself. The default wraps it
      # again, which would hide the name build-netbsd.sh put on the drop.
      # With archive false the artifact name is the filename:
      # lrs-<version>-netbsd<major>-<arch>-<sha>.zip
      - name: Upload binary drop
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error

      # A tag push has no release until one is created. Source archives
      # appear with that release. This adds the binary drop beside them.
      # A hand run keeps the zip as an Actions artifact.
      - name: Attach the drop to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/attach-release.sh
